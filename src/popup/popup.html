<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <link rel="stylesheet" href="popup.css">
  <title>Logged</title>
</head>
<body>
  <!-- ── Header ──────────────────────────────────── -->
  <header class="header">
    <div class="header-top">
      <h1 class="logo">Logged</h1>
      <span class="app-count" id="appCount">0 tracked</span>
    </div>
    <div class="search-bar">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search companies or roles..." autocomplete="off">
    </div>
    <div class="filters" id="statusFilters">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="applied">Applied</button>
      <button class="filter-btn" data-status="interviewing">Interviewing</button>
      <button class="filter-btn" data-status="offer">Offer</button>
      <button class="filter-btn" data-status="closed">Closed</button>
    </div>
  </header>

  <!-- ── Application List ────────────────────────── -->
  <main class="list-container" id="listContainer">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <p class="empty-title">No applications yet</p>
      <p class="empty-sub">Add your first one below, or let Logged detect them automatically.</p>
    </div>
    <ul class="app-list" id="appList"></ul>
  </main>

  <!-- ── Add Application Form ────────────────────── -->
  <div class="add-section">
    <button class="add-toggle" id="addToggle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Application
    </button>
    <form class="add-form hidden" id="addForm">
      <div class="form-row">
        <input type="text" id="inputCompany" placeholder="Company *" required>
        <input type="text" id="inputRole" placeholder="Role *" required>
      </div>
      <div class="form-row">
        <input type="url" id="inputUrl" placeholder="Job posting URL (optional)">
        <input type="date" id="inputDate">
      </div>
      <div class="form-row">
        <input type="text" id="inputNotes" placeholder="Notes (optional)">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="popup/popup.js"></script>
</body>
</html>
